<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKU Campus Guide</title>

<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
  }

  header {
    text-align: center;
    padding: 30px;
  }

  header h2 {
    font-size: 32px;
    margin-bottom: 10px;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    padding: 20px;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: 0.3s;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }

  .card:hover {
    transform: translateY(-10px) scale(1.02);
  }

  .card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    transition: 0.4s;
  }

  .card:hover img {
    transform: scale(1.1);
  }

  .card-body {
    padding: 15px;
  }

  .card h3 {
    margin-bottom: 10px;
    color: #9f7aea;
  }

  section {
    background: rgba(255,255,255,0.05);
    margin: 20px;
    padding: 20px;
    border-radius: 20px;
  }

  input, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin-bottom: 10px;
  }

  button {
    background: linear-gradient(45deg, #6a11cb, #2575fc);
    border: none;
    padding: 10px 20px;
    color: white;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    transform: scale(1.05);
  }

  footer {
    text-align: center;
    padding: 15px;
    opacity: 0.7;
  }

  canvas {
  display: block;
  margin: 10px auto;
}

  @media (max-width: 600px) {
    header h2 {
      font-size: 22px;
    }
  }
</style>

</head>

<body>

<header>
  <h2>KKU Campus Guide</h2>
  <p>กฤติน ตรัสกมล 663380584-1</p>

  <!-- Canvas -->
  <canvas id="logo" width="200" height="100"></canvas>
</header>

<main class="container">

  <div class="card">
    <img src="https://assets.sutori.com/user-uploads/image/76a36e6c-cbc4-4544-aec9-5cf3f0d15276/05.jpeg">
    <div class="card-body">
        <h3>หอสมุด มข.</h3>
        <p>สถานที่อ่านหนังสือและค้นคว้า</p>
    </div>
  </div>

  <div class="card">
    <img src="https://img.wongnai.com/p/192x192/2026/01/22/70f0991e9b8b46a9906c7b215ae8f755.jpg">
    <div class="card-body">
        <h3>บึงสีฐาน</h3>
        <p>สถานที่พักผ่อน วิ่งออกกำลังกาย</p>
    </div>
  </div>

  <div class="card">
    <img src="https://asset.kku.ac.th/wp-content/uploads/2022/04/%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%AB%E0%B8%99%E0%B8%B1%E0%B8%87%E0%B8%AA%E0%B8%B7%E0%B8%AD%E0%B8%A2%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%A2%E0%B9%87%E0%B8%99-%E0%B8%93-%E0%B8%84%E0%B8%AD%E0%B8%A1%E0%B9%80%E0%B8%9E%E0%B8%A5%E0%B9%87%E0%B8%81%E0%B8%8B%E0%B9%8C--300x225.jpg">
    <div class="card-body">
        <h3>complex</h3>
        <p>แหล่งรวมอาหารราคาประหยัด</p>
    </div>
  </div>

  <div class="card">
    <img src="https://www.en.kku.ac.th/web/wp-content/uploads/2018/06/DSC_0476%E0%B9%81%E0%B8%81%E0%B9%89900.jpg">
    <div class="card-body">
        <h3>คณะวิศวกรรม</h3>
        <p>สถานที่เรียนของนักศึกษา</p>
    </div>
  </div>

</main>

<!-- Form -->
<section style="padding:20px;">
  <h3>แนะนำสถานที่</h3>

  <form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="3e12a063-babf-4f8a-82fe-0b91cde67682">

    <input type="text" name="name" placeholder="ชื่อสถานที่" required><br><br>
    <textarea name="message" placeholder="รายละเอียด"></textarea><br><br>
    <input type="url" name="image" placeholder="URL รูปภาพ"><br><br>

    <button type="submit">ส่ง</button>
  </form>
</section>

<footer>
  <p>KKU Guide</p>
</footer>

<script>
const canvas = document.getElementById("logo");
const ctx = canvas.getContext("2d");

let angle = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(100, 50);
  ctx.rotate(angle);

  ctx.beginPath();
  ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.restore();

  ctx.beginPath();
  ctx.arc(100, 50, 15, 0, Math.PI * 2);
  ctx.fillStyle = "#9f7aea";
  ctx.fill();

  ctx.font = "bold 14px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("KKU", 80, 55);

  angle += 0.05;
  requestAnimationFrame(draw);
}

draw();
</script>



</body>
</html>
