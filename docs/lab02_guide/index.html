<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKU Campus Guide</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #4a00e0;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 10px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>KKU Campus Guide</h2>
  <p>กฤติน ตรัสกมล 663380584-1</p>

  <!-- Canvas -->
  <canvas id="logo" width="200" height="100"></canvas>
</header>

<main class="container">

  <div class="card">
    <h3>หอสมุด มข.</h3>
    <img src="https://assets.sutori.com/user-uploads/image/76a36e6c-cbc4-4544-aec9-5cf3f0d15276/05.jpeg">
    <p>สถานที่อ่านหนังสือและค้นคว้า</p>
  </div>

  <div class="card">
    <h3>บึงสีฐาน</h3>
    <img src="https://img.wongnai.com/p/192x192/2026/01/22/70f0991e9b8b46a9906c7b215ae8f755.jpg">
    <p>สถานที่พักผ่อน วิ่งออกกำลังกาย</p>
  </div>

  <div class="card">
    <h3>complex</h3>
    <img src="https://asset.kku.ac.th/wp-content/uploads/2022/04/%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%AB%E0%B8%99%E0%B8%B1%E0%B8%87%E0%B8%AA%E0%B8%B7%E0%B8%AD%E0%B8%A2%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%A2%E0%B9%87%E0%B8%99-%E0%B8%93-%E0%B8%84%E0%B8%AD%E0%B8%A1%E0%B9%80%E0%B8%9E%E0%B8%A5%E0%B9%87%E0%B8%81%E0%B8%8B%E0%B9%8C--300x225.jpg">
    <p>แหล่งรวมอาหารราคาประหยัด</p>
  </div>

  <div class="card">
    <h3>คณะวิศวกรรม</h3>
    <img src="https://www.en.kku.ac.th/web/wp-content/uploads/2018/06/DSC_0476%E0%B9%81%E0%B8%81%E0%B9%89900.jpg">
    <p>สถานที่เรียนของนักศึกษา</p>
  </div>

</main>

<!-- Form -->
<section style="padding:20px;">
  <h3>แนะนำสถานที่</h3>

  <form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="3e12a063-babf-4f8a-82fe-0b91cde67682">

    <input type="text" name="name" placeholder="ชื่อสถานที่" required><br><br>
    <textarea name="message" placeholder="รายละเอียด"></textarea><br><br>
    <input type="url" name="image" placeholder="URL รูปภาพ"><br><br>

    <button type="submit">ส่ง</button>
  </form>
</section>

<footer>
  <p>KKU Guide</p>
</footer>

<script>
  const canvas = document.getElementById("logo");
  const ctx = canvas.getContext("2d");

  let x = 0;

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "yellow";
    ctx.fillRect(x, 20, 50, 50);
    x += 2;
    if (x > canvas.width) x = 0;
    requestAnimationFrame(draw);
  }

  draw();
</script>

</body>
</html>
