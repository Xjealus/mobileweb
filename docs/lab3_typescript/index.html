<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Student Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body class="p-4">

<h2 class="mb-4">ระบบจัดการนักศึกษา</h2>

<div class="card p-3 mb-4">
  <h5>➕ เพิ่มนักศึกษา</h5>
  <div class="row g-3">

    <div class="col-md-2">
      <input id="id" class="form-control" placeholder="ID">
    </div>

    <div class="col-md-2">
      <input id="title_name" class="form-control" placeholder="คำนำหน้า">
    </div>

    <div class="col-md-2">
      <input id="first_name" class="form-control" placeholder="ชื่อ">
    </div>

    <div class="col-md-2">
      <input id="last_name" class="form-control" placeholder="นามสกุล">
    </div>

    <div class="col-md-2">
      <input id="email" class="form-control" placeholder="Email">
    </div>

    <div class="col-md-1">
      <input id="year" type="number" class="form-control" placeholder="ปี">
    </div>

    <div class="col-md-2">
      <input id="major" class="form-control" placeholder="สาขา">
    </div>

    <div class="col-md-1">
      <button id="addBtn" class="btn btn-primary w-100">เพิ่ม</button>
    </div>

  </div>
</div>

<div class="card p-3 mb-4">
  <h5>🔍 ค้นหาชื่อ</h5>
  <div class="input-group">
    <input id="searchName" class="form-control">
    <button id="searchNameBtn" class="btn btn-success">ค้นหา</button>
  </div>
</div>

<div class="card p-3 mb-4">
  <h5>🔍 ค้นหาสาขา</h5>
  <div class="input-group">
    <input id="searchMajor" class="form-control">
    <button id="searchMajorBtn" class="btn btn-warning">ค้นหา</button>
  </div>
</div>

<div class="card p-3 mb-4">
  <h5>🔍 ค้นหา Email</h5>
  <div class="input-group">
    <input id="searchEmail" class="form-control">
    <button id="searchEmailBtn" class="btn btn-danger">ค้นหา</button>
  </div>
</div>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>ID</th>
      <th>คำนำหน้า</th>
      <th>ชื่อ</th>
      <th>นามสกุล</th>
      <th>Email</th>
      <th>ปี</th>
      <th>สาขา</th>
    </tr>
  </thead>
  <tbody id="studentTableBody"></tbody>
</table>

<script type="module" src="./dist/app.js"></script>

</body>
</html>
